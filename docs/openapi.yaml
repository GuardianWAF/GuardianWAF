openapi: 3.1.0
info:
  title: GuardianWAF API
  description: GuardianWAF REST API for security monitoring, configuration, and management.
  version: 1.0.0
  contact:
    name: GuardianWAF
    url: https://github.com/guardianwaf/guardianwaf
  license:
    name: MIT

servers:
  - url: https://localhost:9443
    description: Default dashboard endpoint

security:
  - ApiKeyAuth: []
  - SessionAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Health
    description: Health checks and metrics (public)
  - name: Stats
    description: WAF engine statistics
  - name: Events
    description: Security event queries and streaming
  - name: Config
    description: WAF configuration management
  - name: Routing
    description: Upstream and virtual host routing
  - name: IP ACL
    description: IP whitelist and blacklist management
  - name: Bans
    description: Temporary IP ban management
  - name: Rules
    description: Custom WAF rule CRUD
  - name: AI
    description: AI threat analysis
  - name: Alerting
    description: Webhook and email alerting
  - name: Docker
    description: Docker auto-discovery
  - name: Compliance
    description: Compliance controls, reports, and audit chain
  - name: Analytics
    description: Traffic analytics and reporting
  - name: Cluster
    description: Cluster status and synchronization metadata
  - name: Tenants
    description: Multi-tenant administration
  - name: SSL
    description: SSL certificate status

paths:
  # ── Auth ──────────────────────────────────────────────
  /login:
    get:
      tags: [Auth]
      summary: Serve login page
      security: []
      responses:
        '200':
          description: HTML login page
          content:
            text/html: {}
    post:
      tags: [Auth]
      summary: Authenticate with API key
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: API key
      responses:
        '302':
          description: Redirect to dashboard on success
        '401':
          description: Invalid API key

  /logout:
    get:
      tags: [Auth]
      summary: Clear session and redirect to login
      security: []
      responses:
        '302':
          description: Redirect to login page

  # ── Health (public) ───────────────────────────────────
  /api/v1/health:
    get:
      tags: [Health]
      summary: Engine health check
      security: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  engine:
                    type: boolean
                  eventStore:
                    type: boolean

  /health:
    get:
      tags: [Health]
      summary: Public dashboard health check
      security: []
      responses:
        '200':
          description: JSON status summary

  /healthz:
    get:
      tags: [Health]
      summary: Legacy liveness-style health probe
      security: []
      responses:
        '200':
          description: JSON status summary

  /livez:
    get:
      tags: [Health]
      summary: Process liveness probe
      security: []
      responses:
        '200':
          description: JSON process status summary

  /readyz:
    get:
      tags: [Health]
      summary: Traffic readiness probe
      security: []
      responses:
        '200':
          description: Ready to receive traffic
        '503':
          description: One or more required runtime dependency is not ready, such as configured upstream groups, dashboard listener startup, router construction, event storage, or mandatory GeoIP data.

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics endpoint
      security: []
      responses:
        '200':
          description: Prometheus text format metrics
          content:
            text/plain: {}

  /api/v1/version:
    get:
      tags: [Health]
      summary: Build version information
      security: []
      responses:
        '200':
          description: Version, commit, and build date
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  date:
                    type: string

  # ── Stats ─────────────────────────────────────────────
  /api/v1/stats:
    get:
      tags: [Stats]
      summary: Get engine statistics
      responses:
        '200':
          description: Engine statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_requests:
                    type: integer
                  blocked_requests:
                    type: integer
                  challenged_requests:
                    type: integer
                  logged_requests:
                    type: integer
                  passed_requests:
                    type: integer
                  event_store_errors:
                    type: integer
                  avg_latency_us:
                    type: integer
                  alerting:
                    type: object
                    properties:
                      sent:
                        type: integer
                      failed:
                        type: integer
                      webhook_count:
                        type: integer
                      email_count:
                        type: integer

  # ── Events ────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [Events]
      summary: Query security events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: action
          in: query
          schema:
            type: string
            enum: [block, challenge, log, pass]
        - name: client_ip
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: min_score
          in: query
          schema:
            type: integer
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [timestamp, score]
            default: timestamp
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/WafEvent'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/events/export:
    get:
      tags: [Events]
      summary: Export events as JSON or CSV
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Exported events

  /api/v1/events/{id}:
    get:
      tags: [Events]
      summary: Get event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafEvent'
        '404':
          description: Event not found

  /api/v1/sse:
    get:
      tags: [Events]
      summary: Server-Sent Events stream
      responses:
        '200':
          description: SSE stream of real-time events
          content:
            text/event-stream: {}

  /api/v1/events/stream:
    get:
      tags: [Events]
      summary: Server-Sent Events stream compatibility alias
      responses:
        '200':
          description: SSE stream of real-time events
          content:
            text/event-stream: {}

  # ── Config ────────────────────────────────────────────
  /api/v1/config:
    get:
      tags: [Config]
      summary: Get full WAF configuration
      responses:
        '200':
          description: WAF configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafConfigResponse'
    put:
      tags: [Config]
      summary: Update WAF configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '400':
          description: Invalid configuration

  /api/v1/config/reload:
    post:
      tags: [Config]
      summary: Reload the current WAF configuration
      responses:
        '200':
          description: Configuration reloaded
        '500':
          description: Reload failed

  /api/v1/config/ratelimit:
    get:
      tags: [Config]
      summary: Get rate-limit configuration
      responses:
        '200':
          description: Current rate-limit configuration
    put:
      tags: [Config]
      summary: Update rate-limit configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                default_limit:
                  type: integer
                window:
                  type: string
                  example: 1m
                burst:
                  type: integer
                action:
                  type: string
                  enum: [block, log]
      responses:
        '200':
          description: Rate-limit configuration updated

  /api/v1/config/bot:
    get:
      tags: [Config]
      summary: Get bot detection configuration
      responses:
        '200':
          description: Current bot detection configuration
    put:
      tags: [Config]
      summary: Update bot detection configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Bot detection configuration updated

  # ── Routing ───────────────────────────────────────────
  /api/v1/routing:
    get:
      tags: [Routing]
      summary: Get routing configuration
      responses:
        '200':
          description: Routing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingConfig'
    put:
      tags: [Routing]
      summary: Update routing and rebuild proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Routing updated and proxy rebuilt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/upstreams:
    get:
      tags: [Routing]
      summary: Get upstream health status
      responses:
        '200':
          description: Upstream health data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpstreamStatus'

  /api/v1/ssl:
    get:
      tags: [SSL]
      summary: Get SSL certificate status
      responses:
        '200':
          description: SSL certificate information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSLStatus'

  /api/v1/ssl/certificates:
    post:
      tags: [SSL]
      summary: Upload a certificate compatibility endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cert, key]
              properties:
                name:
                  type: string
                cert:
                  type: string
                  description: Base64-encoded PEM certificate
                key:
                  type: string
                  description: Base64-encoded PEM private key
      responses:
        '400':
          description: Invalid certificate payload
        '501':
          description: Certificate storage backend is not configured

  /api/v1/ssl/certificates/{name}:
    delete:
      tags: [SSL]
      summary: Delete a certificate compatibility endpoint
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Certificate not found

  # ── IP ACL ────────────────────────────────────────────
  /api/v1/ipacl:
    get:
      tags: [IP ACL]
      summary: Get whitelist and blacklist
      responses:
        '200':
          description: IP ACL entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPACLResponse'
    post:
      tags: [IP ACL]
      summary: Add IP to list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list, ip]
              properties:
                list:
                  type: string
                  enum: [whitelist, blacklist]
                ip:
                  type: string
      responses:
        '200':
          description: IP added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
    delete:
      tags: [IP ACL]
      summary: Remove IP from list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list, ip]
              properties:
                list:
                  type: string
                  enum: [whitelist, blacklist]
                ip:
                  type: string
      responses:
        '200':
          description: IP removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  # ── Bans ──────────────────────────────────────────────
  /api/v1/bans:
    get:
      tags: [Bans]
      summary: List active temporary bans
      responses:
        '200':
          description: List of bans
          content:
            application/json:
              schema:
                type: object
                properties:
                  bans:
                    type: array
                    items:
                      $ref: '#/components/schemas/BanEntry'
    post:
      tags: [Bans]
      summary: Add temporary IP ban
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                reason:
                  type: string
                duration:
                  type: string
                  description: Duration (e.g. "1h", "30m")
      responses:
        '200':
          description: Ban added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
    delete:
      tags: [Bans]
      summary: Remove temporary ban
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
      responses:
        '200':
          description: Ban removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  # ── Rules ─────────────────────────────────────────────
  /api/v1/rules:
    get:
      tags: [Rules]
      summary: List custom WAF rules
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomRule'
    post:
      tags: [Rules]
      summary: Add a custom rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRule'
      responses:
        '200':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/rules/{id}:
    put:
      tags: [Rules]
      summary: Update a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRule'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
    delete:
      tags: [Rules]
      summary: Delete a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rule deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  # ── GeoIP ─────────────────────────────────────────────
  /api/v1/geoip/lookup:
    get:
      tags: [Health]
      summary: Look up country for IP
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GeoIP lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIPResult'
    post:
      tags: [Health]
      summary: Look up country for IP from a JSON body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
      responses:
        '200':
          description: GeoIP lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIPResult'

  # ── Logs ──────────────────────────────────────────────
  /api/v1/logs:
    get:
      tags: [Health]
      summary: Get recent engine logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        level:
                          type: string
                          enum: [debug, info, warn, error]
                        message:
                          type: string
                  total:
                    type: integer

  # ── AI ────────────────────────────────────────────────
  /api/v1/ai/providers:
    get:
      tags: [AI]
      summary: Get AI provider catalog
      responses:
        '200':
          description: Provider catalog from models.dev
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIProviderSummary'

  /api/v1/ai/config:
    get:
      tags: [AI]
      summary: Get AI configuration
      responses:
        '200':
          description: Current AI config (masked API key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfig'
    put:
      tags: [AI]
      summary: Set AI configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: string
                model_id:
                  type: string
                api_key:
                  type: string
                base_url:
                  type: string
      responses:
        '200':
          description: AI config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/ai/history:
    get:
      tags: [AI]
      summary: Get AI analysis history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Analysis results
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIAnalysisResult'

  /api/v1/ai/stats:
    get:
      tags: [AI]
      summary: Get AI usage statistics
      responses:
        '200':
          description: Token usage, request counts, cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStats'

  /api/v1/ai/analyze:
    post:
      tags: [AI]
      summary: Trigger manual AI analysis
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Analysis triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnalysisResult'

  /api/v1/ai/test:
    post:
      tags: [AI]
      summary: Test AI provider connection
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  # ── Alerting ──────────────────────────────────────────
  /api/v1/alerting/status:
    get:
      tags: [Alerting]
      summary: Get alerting status
      responses:
        '200':
          description: Alerting status with webhook/email counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertingStatusResponse'

  /api/v1/alerting/webhooks:
    get:
      tags: [Alerting]
      summary: List webhooks
      responses:
        '200':
          description: List of configured webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookTarget'
    post:
      tags: [Alerting]
      summary: Add a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, type]
              properties:
                name:
                  type: string
                url:
                  type: string
                type:
                  type: string
                  enum: [slack, discord, pagerduty, generic]
                events:
                  type: array
                  items:
                    type: string
                min_score:
                  type: integer
                cooldown:
                  type: string
      responses:
        '200':
          description: Webhook added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/alerting/webhooks/{name}:
    delete:
      tags: [Alerting]
      summary: Delete a webhook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/alerting/emails:
    get:
      tags: [Alerting]
      summary: List email targets
      responses:
        '200':
          description: List of email targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmailTarget'
    post:
      tags: [Alerting]
      summary: Add email target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, smtp_host, to]
              properties:
                name:
                  type: string
                smtp_host:
                  type: string
                smtp_port:
                  type: integer
                from:
                  type: string
                to:
                  type: string
      responses:
        '200':
          description: Email target added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/alerting/emails/{name}:
    delete:
      tags: [Alerting]
      summary: Delete email target
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email target deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/alerting/test:
    post:
      tags: [Alerting]
      summary: Send test alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
      responses:
        '200':
          description: Test alert sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/alerts:
    get:
      tags: [Alerting]
      summary: List alert rules compatibility endpoint
      responses:
        '200':
          description: Alert list
    post:
      tags: [Alerting]
      summary: Create alert rule compatibility endpoint
      responses:
        '400':
          description: Use concrete webhook or email alerting endpoints

  /api/v1/alerts/{id}:
    put:
      tags: [Alerting]
      summary: Update alert rule compatibility endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Alert not found
    delete:
      tags: [Alerting]
      summary: Delete alert rule compatibility endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Alert not found

  /api/v1/alerts/history:
    get:
      tags: [Alerting]
      summary: List recent alert history compatibility endpoint
      responses:
        '200':
          description: Alert history

  # ── Docker ────────────────────────────────────────────
  /api/v1/docker/containers:
    get:
      tags: [Docker]
      summary: Get discovered Docker containers
      responses:
        '200':
          description: Docker container list
          content:
            application/json:
              schema:

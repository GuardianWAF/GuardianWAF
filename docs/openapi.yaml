components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SessionAuth:
      type: apiKey
      in: cookie
      name: gwaf_session
    AdminKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Key

  schemas:
    WafEvent:
      type: object
      properties:
        id:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        client_ip:
          type: string
        method:
          type: string
        path:
          type: string
        query:
          type: string
        action:
          type: string
          enum: [block, challenge, log, pass]
        score:
          type: integer
        duration_ns:
          type: integer
        host:
          type: string
        user_agent:
          type: string
        content_type:
          type: string
        referer:
          type: string
        status_code:
          type: integer
        browser:
          type: string
        browser_version:
          type: string
        os:
          type: string
        device_type:
          type: string
        is_bot:
          type: boolean
        tls_version:
          type: string
        tls_cipher:
          type: string
        sni:
          type: string
        ja3_hash:
          type: string
        ja4_fingerprint:
          type: string
        country:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              detector:
                type: string
              severity:
                type: string
              score:
                type: integer
              description:
                type: string
              matched_value:
                type: string
              location:
                type: string
              confidence:
                type: number
              category:
                type: string

    UpstreamConfig:
      type: object
      properties:
        name:
          type: string
        load_balancer:
          type: string
          enum: [round_robin, weighted, least_conn, ip_hash]
        targets:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              weight:
                type: integer
        health_check:
          type: object
          properties:
            enabled:
              type: boolean
            interval:
              type: string
            timeout:
              type: string
            path:
              type: string

    RouteConfig:
      type: object
      properties:
        path:
          type: string
        upstream:
          type: string
        strip_prefix:
          type: boolean

    VirtualHostConfig:
      type: object
      properties:
        domains:
          type: array
          items:
            type: string
        tls:
          type: object
          properties:
            cert_file:
              type: string
            key_file:
              type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteConfig'

    RoutingConfig:
      type: object
      properties:
        upstreams:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamConfig'
        virtual_hosts:
          type: array
          items:
            $ref: '#/components/schemas/VirtualHostConfig'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteConfig'

    ApiResult:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        error:
          type: string

    WafConfigResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [enforce, monitor, disabled]
        tls:
          type: object
          properties:
            enabled:
              type: boolean
            listen:
              type: string
            http_redirect:
              type: boolean
            acme:
              type: object
              properties:
                enabled:
                  type: boolean
                email:
                  type: string
                cache_dir:
                  type: string
        waf:
          type: object
          properties:
            rules:
              type: object
            rate_limit:
              type: object
            bot:
              type: object
            custom_rules:
              type: object
            ai:
              type: object
            ato:
              type: object
            api_security:
              type: object
        docker:
          type: object
          properties:
            enabled:
              type: boolean
            socket_path:
              type: string
            label_prefix:
              type: string
            poll_interval:
              type: string
            network:
              type: string
        ai_analysis:
          type: object
          properties:
            enabled:
              type: boolean
            batch_size:
              type: integer
            min_score:
              type: integer
            auto_block:
              type: boolean
        alerting:
          type: object
          properties:
            enabled:
              type: boolean
            webhook_count:
              type: integer

    SSLCertInfo:
      type: object
      properties:
        domain:
          type: string
        dns_names:
          type: array
          items:
            type: string
        not_after:
          type: string
          format: date-time
        days_left:
          type: integer
        issuer_cn:
          type: string
        needs_renewal:
          type: boolean
        is_wildcard:
          type: boolean

    SSLStatus:

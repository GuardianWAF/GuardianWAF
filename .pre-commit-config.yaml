# GuardianWAF pre-commit hooks
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: [--fix]

  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        args: [-c .editorconfig]

  - repo: local
    hooks:
      - id: go-test
        name: go test
        entry: go test -race -count=1 ./...
        pass_filenames: false
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        pass_filenames: false
        language: system
        types: [go]

      - id: go-fmt
        name: go fmt
        entry: gofmt -s -l .
        pass_filenames: true
        language: system
        types: [go]
        description: "Check Go files are formatted"

      - id: block-banned-paths
        name: block banned repo-root paths from being tracked
        entry: scripts/check-no-banned-tracked.sh
        pass_filenames: false
        language: system
        always_run: true
        description: "Refuse commits that stage .coverage-*, tmpcov.txt, security-report/, or .project/."

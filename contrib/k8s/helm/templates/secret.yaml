{{- /*
Dashboard credentials shared by every replica.

Without this, an unconfigured chart sets no GWAF_DASHBOARD_API_KEY at all and
each pod generates its own random key at startup, so with replicaCount > 1 a
key issued by one pod is rejected by the others. Generating one Secret here
gives the whole Deployment a single credential.

The `lookup` guard reuses the value already stored in the cluster so
`helm upgrade` does not rotate the key (and invalidate every client) on every
release. `lookup` returns an empty map during `helm template`/`--dry-run`, in
which case a fresh value is rendered and never applied.

Set apiKey.existingSecret / adminKey.existingSecret to manage credentials
outside the chart; this Secret is then not created.
*/}}
{{- $manageAPIKey := and (not .Values.apiKey.existingSecret) (not .Values.apiKey.value) }}
{{- $manageAdminKey := and (not .Values.adminKey.existingSecret) (not .Values.adminKey.value) }}
{{- if or $manageAPIKey $manageAdminKey }}
{{- $name := printf "%s-generated" (include "guardianwaf.fullname" .) }}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- if $current }}{{- $data = $current.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "guardianwaf.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $manageAPIKey }}
  api-key: {{ (get $data "api-key") | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
  {{- if $manageAdminKey }}
  admin-key: {{ (get $data "admin-key") | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guardianwaf.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardianwaf.labels" . | nindent 4 }}
data:
  {{ .Values.config.fileName | default "guardianwaf.yaml" }}: |
    mode: {{ .Values.config.mode | quote }}
    listen: {{ .Values.config.listen | quote }}
    allow_private_upstreams: {{ .Values.config.allowPrivateUpstreams }}
    tls:
      enabled: {{ .Values.tls.enabled }}
      {{- if .Values.tls.enabled }}
      cert_file: "/etc/guardianwaf/certs/tls.crt"
      key_file: "/etc/guardianwaf/certs/tls.key"
      {{- end }}
    {{- if .Values.dashboard.enabled }}
    dashboard:
      enabled: true
      listen: {{ .Values.config.dashboardListen | quote }}
      api_key: "${GWAF_DASHBOARD_API_KEY}"
      admin_key: "${GWAF_DASHBOARD_ADMIN_KEY}"
      audit_path: /var/lib/guardianwaf/audit/dashboard.jsonl
    {{- end }}
    logging:
      level: {{ .Values.config.logLevel | quote }}
      format: {{ .Values.config.logFormat | quote }}
      output: stdout
      log_blocked: true
      log_allowed: false
    events:
      storage: {{ .Values.config.events.storage | quote }}
      max_events: {{ .Values.config.events.maxEvents }}
      file_path: {{ .Values.config.events.filePath | quote }}
    waf:
      detection:
        enabled: true
        threshold:
          block: {{ .Values.config.detection.blockThreshold }}
          log: {{ .Values.config.detection.logThreshold }}
        detectors:
          sqli:
            enabled: true
            multiplier: 1.0
          xss:
            enabled: true
            multiplier: 1.0
          lfi:
            enabled: true
            multiplier: 1.0
          cmdi:
            enabled: true
            multiplier: 1.0
          xxe:
            enabled: true
            multiplier: 1.0
          ssrf:
            enabled: true
            multiplier: 1.0
    {{- if .Values.config.geoip.enabled }}
      geoip:
        enabled: true
        {{- if .Values.config.geoip.dbPath }}
        db_path: {{ .Values.config.geoip.dbPath | quote }}
        {{- end }}
        auto_download: {{ .Values.config.geoip.autoDownload }}
    {{- end }}
    {{- if .Values.upstreams }}
    upstreams:
    {{- range .Values.upstreams }}
      - name: {{ .name | quote }}
        load_balancer: {{ .strategy | default "round_robin" | quote }}
        targets:
        {{- range .targets }}
          - url: {{ .url | quote }}
            weight: {{ .weight | default 1 }}
        {{- end }}
        {{- if .healthCheck }}
        health_check:
          enabled: {{ .healthCheck.enabled }}
          path: {{ .healthCheck.path | default "/healthz" }}
          interval: {{ .healthCheck.interval | default "10s" }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if .Values.routes }}
    routes:
    {{- range .Values.routes }}
      - path: {{ .path | quote }}
        upstream: {{ .upstream | quote }}
        strip_prefix: {{ .stripPrefix | default false }}
    {{- end }}
    {{- end }}
    {{- if .Values.cluster.enabled }}
    cluster:
      enabled: true
      node_id: "${POD_NAME}"
      bind_addr: "0.0.0.0:{{ .Values.cluster.raftPort }}"
      gossip_addr: "0.0.0.0:{{ .Values.cluster.gossipPort }}"
      peers:
        {{- $fullname := include "guardianwaf.fullname" . }}
        {{- $ns := .Release.Namespace }}
        {{- range $i, $e := until (int $.Values.cluster.replicas) }}
        - id: "{{ $fullname }}-{{ $i }}"
          addr: "{{ $fullname }}-{{ $i }}.{{ $fullname }}-cluster.{{ $ns }}.svc.cluster.local:{{ $.Values.cluster.raftPort }}"
        {{- end }}
      election_timeout_min: {{ .Values.cluster.electionTimeoutMin | default "2s" | quote }}
      election_timeout_max: {{ .Values.cluster.electionTimeoutMax | default "4s" | quote }}
      heartbeat_interval: {{ .Values.cluster.heartbeatInterval | default "50ms" | quote }}
      data_dir: /var/lib/guardianwaf/raft
    {{- end }}

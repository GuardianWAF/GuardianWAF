{{- if .Values.cluster.enabled }}
# StatefulSet — stable pod identities for Raft and gossip.
#
# Each pod gets an ordinal name (guardianwaf-0, -1, -2) and a stable DNS
# record via the headless Service. Raft and gossip use these addresses
# for peer discovery and consensus.
#
# The ConfigMap references pod DNS names as seed peers. Gossip discovers
# additional peers automatically after the initial bootstrap.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "guardianwaf.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardianwaf.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "guardianwaf.fullname" . }}-cluster
  replicas: {{ .Values.cluster.replicas }}
  selector:
    matchLabels:
      {{- include "guardianwaf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "guardianwaf.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "guardianwaf.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30

      containers:
        - name: guardianwaf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -c
            - /etc/guardianwaf/guardianwaf.yaml

          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
            - name: dashboard
              containerPort: 9443
              protocol: TCP
            - name: raft
              containerPort: 7947
              protocol: TCP
            - name: gossip
              containerPort: 7946
              protocol: UDP

          env:
            # Kubernetes downward API — sets POD_NAME to the pod's name
            # (e.g., "guardianwaf-0"). The ConfigMap uses ${POD_NAME}
            # as the cluster node_id.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.apiKey.existingSecret }}
            - name: GWAF_DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- end }}
            {{- if .Values.adminKey.existingSecret }}
            - name: GWAF_DASHBOARD_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminKey.existingSecret }}
                  key: {{ .Values.adminKey.existingSecretKey }}
            {{- end }}

          volumeMounts:
            - name: config
              mountPath: /etc/guardianwaf
              readOnly: true
            - name: cache
              mountPath: /var/cache/guardianwaf
            - name: state
              mountPath: /var/lib/guardianwaf
            - name: wal
              mountPath: /var/lib/guardianwaf/raft
            {{- if .Values.tls.enabled }}
            - name: certs
              mountPath: /etc/guardianwaf/certs
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /livez
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

      volumes:
        - name: config
          configMap:
            name: {{ include "guardianwaf.fullname" . }}-config
        - name: cache
          emptyDir:
            sizeLimit: 100Mi
        - name: state
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.tls.enabled }}
        - name: certs
          secret:
            secretName: {{ .Values.tls.secretName }}
            optional: true
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.cluster.walSize | default "1Gi" }}
{{- end }}

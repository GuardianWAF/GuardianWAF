{{- include "guardianwaf.validateCluster" . }}
{{- if .Values.cluster.enabled }}
# StatefulSet — stable pod identities for Raft and gossip.
#
# Each pod gets an ordinal name (guardianwaf-0, -1, -2) and a stable DNS
# record via the headless Service. Raft and gossip use these addresses
# for peer discovery and consensus.
#
# The ConfigMap lists every voter by stable pod DNS name. Gossip tracks
# liveness; the configured Raft voting set remains fixed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "guardianwaf.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardianwaf.labels" . | nindent 4 }}
spec:
  podManagementPolicy: Parallel
  serviceName: {{ include "guardianwaf.fullname" . }}-cluster
  replicas: {{ .Values.cluster.replicas }}
  selector:
    matchLabels:
      {{- include "guardianwaf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "guardianwaf.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "guardianwaf.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Must exceed the app's 30s drain deadline, or SIGKILL races the flush.
      terminationGracePeriodSeconds: 45

      containers:
        - name: guardianwaf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Let kube-proxy and the ingress drop this pod from their endpoints
          # before serve stops accepting, so a rolling update does not refuse
          # connections (the Deployment template does the same).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          args:
            - serve
            - -c
            - /etc/guardianwaf/{{ .Values.config.fileName | default "guardianwaf.yaml" }}

          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: {{ .Values.tls.port }}
              protocol: TCP
            {{- end }}
            - name: dashboard
              containerPort: 9443
              protocol: TCP
            - name: raft
              containerPort: {{ .Values.cluster.raftPort }}
              protocol: TCP
            - name: gossip
              containerPort: {{ .Values.cluster.gossipPort }}
              protocol: UDP

          env:
            # Kubernetes downward API — sets POD_NAME to the pod's name
            # (e.g., "guardianwaf-0"). The ConfigMap uses ${POD_NAME}
            # as the cluster node_id.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GWAF_CLUSTER_SECRET
              {{- if .Values.cluster.secret.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.secret.existingSecret }}
                  key: {{ .Values.cluster.secret.existingSecretKey }}
              {{- else if .Values.cluster.secret.value }}
              value: {{ .Values.cluster.secret.value | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-generated" (include "guardianwaf.fullname" .) }}
                  key: cluster-secret
              {{- end }}
            {{- if .Values.apiKey.existingSecret }}
            - name: GWAF_DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- else if .Values.apiKey.value }}
            - name: GWAF_DASHBOARD_API_KEY
              value: {{ .Values.apiKey.value | quote }}
            {{- else }}
            # Falls back to the chart-generated Secret so every replica shares
            # one key instead of each pod minting its own at startup.
            - name: GWAF_DASHBOARD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-generated" (include "guardianwaf.fullname" .) }}
                  key: api-key
            {{- end }}
            {{- if .Values.adminKey.existingSecret }}
            - name: GWAF_DASHBOARD_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminKey.existingSecret }}
                  key: {{ .Values.adminKey.existingSecretKey }}
            {{- else if .Values.adminKey.value }}
            - name: GWAF_DASHBOARD_ADMIN_KEY
              value: {{ .Values.adminKey.value | quote }}
            {{- else }}
            - name: GWAF_DASHBOARD_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-generated" (include "guardianwaf.fullname" .) }}
                  key: admin-key
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/guardianwaf
              readOnly: true
            - name: cache
              mountPath: /var/cache/guardianwaf
            - name: state
              mountPath: /var/lib/guardianwaf
            - name: state
              mountPath: /var/log/guardianwaf
              subPath: logs
            - name: wal
              mountPath: /var/lib/guardianwaf/raft
            {{- if .Values.tls.enabled }}
            - name: certs
              mountPath: /etc/guardianwaf/certs
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: /livez
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

      volumes:
        - name: config
          configMap:
            name: {{ .Values.existingConfigMap | default (printf "%s-config" (include "guardianwaf.fullname" .)) }}
        - name: cache
          emptyDir:
            sizeLimit: 100Mi
        - name: state
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.tls.enabled }}
        - name: certs
          secret:
            secretName: {{ .Values.tls.secretName }}
            optional: true
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.cluster.walSize | default "1Gi" }}
{{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "guardianwaf.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardianwaf.labels" . | nindent 4 }}
  {{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if .Values.ingress.denyInternalEndpoints }}
  {{- /*
    /metrics, /healthz, /livez and /readyz are registered on the proxy listener
    as exact ServeMux patterns, ahead of the "/" route and outside the WAF
    middleware. A "/" Prefix rule therefore publishes them to the internet,
    which docs/metrics.md explicitly forbids. Deny them at the edge unless the
    operator opts out.
  */}}
  {{- $deny := "location = /metrics { return 404; }\nlocation = /healthz { return 404; }\nlocation = /livez   { return 404; }\nlocation = /readyz  { return 404; }\n" }}
  {{- $existing := index $ann "nginx.ingress.kubernetes.io/server-snippet" | default "" }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/server-snippet" (printf "%s%s" $deny $existing) }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "guardianwaf.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}

# GuardianWAF Helm Chart Values

replicaCount: 2

image:
  repository: ghcr.io/guardianwaf/guardianwaf
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when empty. Pin deployments to an immutable
  # semver tag or digest instead of the mutable "latest" tag.
  tag: ""

# WAF configuration
config:
  fileName: guardianwaf.yaml
  mode: enforce            # enforce, monitor, disabled
  listen: ":8088"          # Main HTTP listener
  allowPrivateUpstreams: true
  dashboardListen: ":9443" # Dashboard/API listener
  logLevel: info           # debug, info, warn, error
  logFormat: json          # json, text

  detection:
    blockThreshold: 50
    logThreshold: 25

  geoip:
    enabled: false
    dbPath: ""
    autoDownload: false

  events:
    storage: memory
    maxEvents: 100000
    filePath: /var/log/guardianwaf/events.jsonl

# Environment variables (override config values)
env: {}
  # GWAF_MODE: enforce
  # GWAF_THRESHOLD_BLOCK: 50

# Existing ConfigMap with a full config file named by config.fileName.
existingConfigMap: ""

# Upstream backends
upstreams: []
  # - name: backend1
  #   targets:
  #     - url: http://backend:8080
  #       weight: 1
  #   strategy: round_robin  # round_robin, weighted, least_conn, ip_hash
  #   healthCheck:
  #     enabled: true
  #     path: /healthz
  #     interval: 10s

# Route table. At least one route is required for a useful reverse-proxy
# deployment unless existingConfigMap supplies a complete GuardianWAF config.
routes: []
  # - path: /
  #   upstream: backend1
  #   stripPrefix: false

# Dashboard service
dashboard:
  enabled: true
  service:
    type: ClusterIP
    port: 9443
    annotations: {}

# Main WAF service
service:
  type: ClusterIP
  port: 80
  annotations: {}
  # service.beta.kubernetes.io/aws-load-balancer-type: nlb

# TLS for the main listener
tls:
  enabled: false
  secretName: guardianwaf-certs
  # certManager:
  #   enabled: true
  #   issuerRef:
  #     name: letsencrypt-prod
  #     kind: ClusterIssuer

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  hosts: []
  #   - host: waf.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  #   - secretName: waf-example-tls
  #     hosts:
  #       - waf.example.com

# API key for dashboard access
# WARNING: Do not use 'value' in production — it exposes the API key in plain
# text in the pod spec (visible via kubectl get pod -o yaml). Use existingSecret.
apiKey:
  value: ""
  existingSecret: ""
  existingSecretKey: "api-key"

# Separate system admin key for tenant-admin endpoints.
# Leave empty to disable tenant-admin endpoints. Use existingSecret in production.
adminKey:
  value: ""
  existingSecret: ""
  existingSecretKey: "admin-key"

# Resources
resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - guardianwaf
          topologyKey: kubernetes.io/hostname

# Security context
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

# Stateful runtime paths.
# When persistence.enabled is false, an emptyDir keeps read-only-root runtime
# paths writable but data is lost on pod replacement. Enable persistence or set
# existingClaim for file-backed events, ACME cache, replay captures, analytics,
# tenant stores, or other durable state.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  # ReadWriteOnce is suitable for one replica. Use ReadWriteMany or separate
  # per-pod storage when running multiple replicas with file-backed state.
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  emptyDir:
    sizeLimit: 1Gi

# Service account
serviceAccount:
  create: true
  automountToken: false
  annotations: {}
  name: ""

# Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

# Prometheus monitoring
prometheus:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
    labels: {}

# Optional ingress NetworkPolicy. Enable in clusters with a NetworkPolicy
# controller after adjusting the ingress controller namespace selector.
networkPolicy:
  enabled: false
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      - podSelector: {}
    ports:
      - protocol: TCP
        port: 8088
      - protocol: TCP
        port: 9443

# Istio service mesh integration
istio:
  enabled: false
  # Injection annotation: "enabled" or "disabled"
  injection: enabled
  # VirtualService configuration
  virtualService:
    enabled: false
    gateways:
      - mesh
    hosts: []
    # retries:
    #   attempts: 3
    #   perTryTimeout: 10s
  # DestinationRule configuration
  destinationRule:
    enabled: false
    # trafficPolicy:
    #   connectionPool:
    #     tcp:
    #       maxConnections: 100
    #     http:
    #       h2UpgradePolicy: DEFAULT
    #   outlierDetection:
    #     consecutive5xxErrors: 5
    #     interval: 30s
    #     baseEjectionTime: 30s

# Cluster mode — Raft consensus + gossip membership for multi-node
# state replication (bans, rules, rate-limit counters).
# When enabled, deploys a StatefulSet with a headless Service instead of
# a Deployment, so each pod gets a stable DNS name for Raft and gossip.
cluster:
  enabled: false

  # Number of cluster replicas. Must be odd (3 or 5) for Raft quorum.
  replicas: 3

  # Raft TCP port — leader election + log replication.
  raftPort: 7947

  # Gossip UDP port — membership + peer discovery.
  gossipPort: 7946

  # Raft timing parameters (optional — defaults shown).
  electionTimeoutMin: "2s"
  electionTimeoutMax: "4s"
  heartbeatInterval: "50ms"

  # Raft WAL persistence — size of the persistent volume for each pod.
  # The WAL stores committed entries, term, and vote data so the cluster
  # survives a full restart. Set to 0 to disable persistence.
  walSize: 5Gi

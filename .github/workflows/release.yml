name: Release

on:
  push:
    tags: ['v*']

# Default token scope is read-only; release jobs opt in to write/OIDC scopes.
permissions:
  contents: read

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check build prerequisites
        run: ./scripts/check-prereqs.sh

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build embedded dashboard
        run: ./scripts/build-dashboard.sh

      - name: gofmt check
        run: |
          out="$(gofmt -s -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt check failed — refusing to release unformatted code:"
            echo "$out"
            exit 1
          fi
          echo "gofmt check passed."

      - name: Run tests before release
        run: go test -race -count=1 ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release binary checksum evidence
        run: |
          mkdir -p dist/release-evidence/release/release-artifacts
          cp dist/checksums.txt dist/release-evidence/release/release-artifacts/checksums.txt
          ./scripts/verify-release-evidence.sh --check-release-checksums dist/release-evidence/release

      - name: Upload release binary checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binary-checksums
          path: dist/checksums.txt
          if-no-files-found: error

  docker:
    needs: goreleaser
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check build prerequisites
        run: ./scripts/check-prereqs.sh

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build embedded dashboard
        run: ./scripts/build-dashboard.sh

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
            IMAGE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Record release image digest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p dist/release-evidence/release/supply-chain
          {
            echo "version=${{ github.ref_name }}"
            echo "git_commit=${{ github.sha }}"
            echo "heavy=1"
          } > dist/release-evidence/release/manifest.txt
          {
            echo "url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "result: success"
          } > dist/release-evidence/release/hosted-ci/ci-run.txt
          {
            echo "image=ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
            echo "image_ref=${IMAGE_REF}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "commit=${{ github.sha }}"
            echo "tag=${{ github.ref_name }}"
          } > dist/release-evidence/release/supply-chain/image-digest.txt
          docker buildx imagetools inspect "${IMAGE_REF}" > dist/release-evidence/release/supply-chain/imagetools.txt
          echo "image_ref=${IMAGE_REF}" > dist/release-evidence/release/supply-chain/image-ref.txt

      - name: Generate image SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            anchore/syft:v1.38.0 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -o spdx-json=/out/dist/release-evidence/release/supply-chain/sbom.spdx.json
          cp dist/release-evidence/release/supply-chain/sbom.spdx.json sbom.spdx.json

      - name: Scan released image
        run: |
          set -o pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.68.1 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} | tee dist/release-evidence/release/supply-chain/trivy.txt

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: sbom.spdx.json

      - name: Verify signed image digest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -o pipefail
          {
            echo "image_ref=${IMAGE_REF}"
            echo "certificate_identity_regexp=https://github.com/guardianwaf/guardianwaf/.github/workflows/release.yml@refs/tags/v.*"
            echo "certificate_oidc_issuer=https://token.actions.githubusercontent.com"
            cosign verify \
              --certificate-identity-regexp 'https://github.com/guardianwaf/guardianwaf/.github/workflows/release.yml@refs/tags/v.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE_REF}" 2>&1
          } | tee dist/release-evidence/release/supply-chain/cosign-verify.txt

      - name: Verify provenance attestation
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -o pipefail
          {
            echo "image_ref=${IMAGE_REF}"
            echo "certificate_identity_regexp=https://github.com/guardianwaf/guardianwaf/.github/workflows/release.yml@refs/tags/v.*"
            echo "certificate_oidc_issuer=https://token.actions.githubusercontent.com"
            cosign verify-attestation \
              --type slsaprovenance \
              --certificate-identity-regexp 'https://github.com/guardianwaf/guardianwaf/.github/workflows/release.yml@refs/tags/v.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE_REF}" 2>&1
          } | tee dist/release-evidence/release/supply-chain/provenance-verify.txt

      - name: Verify SBOM attestation
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -o pipefail
          {
            echo "image_ref=${IMAGE_REF}"
            echo "certificate_identity_regexp=https://github.com/guardianwaf/guardianwaf/.github/workflows/release.yml@refs/tags/v.*"
            echo "certificate_oidc_issuer=https://token.actions.githubusercontent.com"
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity-regexp 'https://github.com/guardianwaf/guardianwaf/.github/workflows/release.yml@refs/tags/v.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE_REF}" 2>&1
          } | tee dist/release-evidence/release/supply-chain/sbom-attestation-verify.txt

      - name: Verify release supply-chain evidence
        run: ./scripts/verify-release-evidence.sh --check-supply-chain dist/release-evidence/release

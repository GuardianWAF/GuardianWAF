apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-with-waf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: myapp
          image: myapp:latest
          ports:
            - containerPort: 3000
          # Harden the app container too — a WAF sidecar protects the network
          # edge, but defense-in-depth still wants a locked-down workload.
          # (Adjust readOnlyRootFilesystem / writable volumes to your app's needs.)
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: guardianwaf
          image: ghcr.io/guardianwaf/guardianwaf:latest
          args: ["sidecar", "--upstream", "http://localhost:3000", "--listen", ":8088"]
          ports:
            - containerPort: 8088
          livenessProbe:
            httpGet:
              path: /livez
              port: 8088
            initialDelaySeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8088
            initialDelaySeconds: 3
          resources:
            limits:
              memory: "64Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: guardianwaf-state
              mountPath: /var/lib/guardianwaf
            - name: guardianwaf-state
              mountPath: /var/log/guardianwaf
              subPath: logs
      volumes:
        - name: guardianwaf-state
          emptyDir:
            sizeLimit: 256Mi

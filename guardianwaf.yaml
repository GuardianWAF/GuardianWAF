# GuardianWAF default configuration
# This file is intentionally schema-valid and suitable as a starting point for
# local Docker Compose or standalone reverse-proxy deployments.

mode: enforce
listen: ":8088"
# Explicitly enabled because the default Docker/Kubernetes examples route to
# service-network backends. Keep false for public-only upstream policies.
allow_private_upstreams: true

tls:
  enabled: false
  listen: ":8443"
  http_redirect: false
  # For production TLS, either set cert_file/key_file or enable ACME:
  # cert_file: "/etc/guardianwaf/certs/server.pem"
  # key_file: "/etc/guardianwaf/certs/server-key.pem"
  # acme:
  #   enabled: true
  #   email: "admin@example.com"
  #   domains:
  #     - "app.example.com"
  #   cache_dir: "/var/lib/guardianwaf/acme"

upstreams:
  - name: backend
    load_balancer: round_robin
    targets:
      - url: "http://backend:3000"
        weight: 1
    health_check:
      enabled: true
      interval: 10s
      timeout: 3s
      path: /healthz

routes:
  - path: /
    upstream: backend
    strip_prefix: false

waf:
  ip_acl:
    enabled: true
    whitelist: []
    blacklist: []
    auto_ban:
      enabled: true
      default_ttl: 1h
      max_ttl: 24h

  rate_limit:
    enabled: true
    rules:
      - id: global
        scope: ip
        limit: 1000
        window: 1m
        burst: 50
        action: block

  sanitizer:
    enabled: true
    max_url_length: 8192
    max_header_size: 8192
    max_header_count: 100
    max_body_size: 10485760
    max_cookie_size: 4096
    block_null_bytes: true
    normalize_encoding: true
    strip_hop_by_hop: true
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      - OPTIONS

  detection:
    enabled: true
    threshold:
      block: 50
      log: 25
    detectors:
      sqli:
        enabled: true
        multiplier: 1.0
      xss:
        enabled: true
        multiplier: 1.0
      lfi:
        enabled: true
        multiplier: 1.0
      cmdi:
        enabled: true
        multiplier: 1.0
      xxe:
        enabled: true
        multiplier: 1.0
      ssrf:
        enabled: true
        multiplier: 1.0

  challenge:
    enabled: false
    difficulty: 20
    cookie_ttl: 1h
    cookie_name: __gwaf_challenge

  bot_detection:
    enabled: true
    mode: monitor
    tls_fingerprint:
      enabled: true
      known_bots_action: block
      unknown_action: log
      mismatch_action: log
    user_agent:
      enabled: true
      block_empty: true
      block_known_scanners: true
    behavior:
      enabled: true
      window: 5m
      rps_threshold: 10
      error_rate_threshold: 30

  response:
    security_headers:
      enabled: true
      hsts:
        enabled: false
      x_content_type_options: true
      x_frame_options: SAMEORIGIN
      referrer_policy: strict-origin-when-cross-origin
      permissions_policy: "camera=(), microphone=(), geolocation=()"
    data_masking:
      enabled: true
      mask_credit_cards: true
      mask_ssn: true
      mask_api_keys: true
      strip_stack_traces: true
    error_pages:
      enabled: true
      mode: production

dashboard:
  enabled: true
  # The built-in dashboard server is plain HTTP; expose it only on a trusted
  # interface or behind a TLS-terminating reverse proxy.
  listen: ":9443"
  api_key: ""
  admin_key: ""
  tls: false

mcp:
  enabled: false
  transport: stdio

docker:
  enabled: false
  socket_path: /var/run/docker.sock
  label_prefix: gwaf
  poll_interval: 5s
  network: bridge

logging:
  level: info
  format: json
  output: stdout
  log_allowed: false
  log_blocked: true
  log_body: false

events:
  storage: memory
  max_events: 100000
  file_path: "/var/log/guardianwaf/events.jsonl"

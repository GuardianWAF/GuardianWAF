version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errorlint
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
      enable-all: false
    revive:
      rules:
        # unused-parameter is noisy and low-value (interface impls, callbacks, and
        # signature-stability all legitimately keep unused params). Disabled.
        - name: unused-parameter
          disabled: true
    gocritic:
      # Disable the purely-stylistic control-flow checks: rewriting working
      # if/else and switch statements is churn-with-risk and no correctness gain.
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
        - appendAssign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - govet
          - revive
        path: _test\.go
      - linters:
          - unparam
        path: internal/acme/client\.go
        text: result 1 .error. is always nil
      - linters:
          - staticcheck
        text: QF1
      # (Go 1.25/1.26 stdlib deprecations — ACME JWK still uses elliptic.Unmarshal
      # and PublicKey.X/Y for ECDSA key encoding; crypto/ecdh is ECDH-only and
      # cannot replace these. golangci-lint excludes SA1019 for _test\.go (line 41
      # above). ReverseProxy.Director → Rewrite is done. No additional suppressions.)
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

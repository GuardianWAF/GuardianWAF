version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
      enable-all: false
    revive:
      rules:
        # unused-parameter is noisy and low-value (interface impls, callbacks, and
        # signature-stability all legitimately keep unused params). Disabled.
        - name: unused-parameter
          disabled: true
    gocritic:
      # Disable the purely-stylistic control-flow checks: rewriting working
      # if/else and switch statements is churn-with-risk and no correctness gain.
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
        - appendAssign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - govet
          - revive
          - staticcheck
        path: _test\.go
      - linters:
          - unparam
        path: internal/acme/client\.go
        text: result 1 .error. is always nil
      - linters:
          - staticcheck
        text: QF1
      # (All Go 1.25/1.26 stdlib deprecations have been fully migrated:
      # elliptic.Unmarshal → crypto/ecdh, ReverseProxy.Director → Rewrite,
      # ACME JWK PublicKey.X/Y → crypto/ecdh fixed-length encoding. No SA1019
      # suppressions remain.)
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

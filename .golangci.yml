version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
      enable-all: false
    revive:
      rules:
        # unused-parameter is noisy and low-value (interface impls, callbacks, and
        # signature-stability all legitimately keep unused params). Disabled.
        - name: unused-parameter
          disabled: true
    gocritic:
      # Disable the purely-stylistic control-flow checks: rewriting working
      # if/else and switch statements is churn-with-risk and no correctness gain.
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
        - appendAssign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - govet
          - revive
          - staticcheck
        path: _test\.go
      - linters:
          - unparam
        path: internal/acme/client\.go
        text: result 1 .error. is always nil
      - linters:
          - staticcheck
        text: QF1
      # Tracked Go 1.25/1.26 stdlib deprecation: ACME JWK still reads PublicKey.X/Y
      # directly. Migrating to PublicKey.Bytes changes JWK coordinate zero-padding
      # (a behaviour change in the account thumbprint), so it is deferred to
      # separate, ACME-server-tested work. (elliptic.Unmarshal → crypto/ecdh and
      # ReverseProxy.Director → Rewrite have already been fully migrated.)
      - linters:
          - staticcheck
        path: internal/acme/client\.go
        text: "SA1019: pub\\.(X|Y) has been deprecated"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
